
<ion-header>
  <ion-toolbar color="dark">
    <ion-buttons slot="start">
      <ion-back-button color="light" defaultHref="/"><ion-icon name="chevron-back-outline"></ion-icon></ion-back-button> <!--註冊界面-->
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">


<ion-card>
  <ion-card-header style="text-align:center;">
    <ion-card-title color="light"><ion-label><b>忘記密碼</b></ion-label></ion-card-title>
   <h3>請輸入您的電郵地址</h3>
  </ion-card-header>

<ion-card-content>
 <ion-list>
  <ion-item>
    <ion-label position="floating">電郵地址:</ion-label>
    <ion-input type="text" [(ngModel)]="email"></ion-input>
  </ion-item>
 </ion-list>
</ion-card-content>
</ion-card>

<ion-button color="light" (click)="resetPassword()" expand="block" shape="round">
  <ion-icon name="repeat-outline"></ion-icon>
  <b> 更改密碼</b>
</ion-button>

</ion-content>
