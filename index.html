<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <title>Word Game</title>
        <style>
            /* Background */
            body 
            {
                font-family: Arial, sans-serif;
                text-align: center;
                background-image: url(./src/assets/gameBackground2.jpg);
                padding: 40px 10px; 
                margin: 0;
            }
            
            /* Content Container */
            .content-container 
            {
                width: 100%;
                max-width: 800px; 
                max-height: 1300px;
                height: 800vh;
                margin: 0 auto;
                background: white;
                padding: 30px 15px;
                border: 13px solid #333333;
                border-radius: 30px;
                box-shadow: 0px 100px 300px rgba(0,0,0,0.3);
                box-sizing: border-box; 
                display: flex;
                flex-direction: column;
            }
            
            /* Icon */
            .icon-div 
            {
                animation: float 3s ease-in-out infinite;
            }
            #icon
            {
                margin-bottom: -15px;
                height: 100px; 
                width: 100px;
            }
            #title
            {
                font-weight: bold;
                font-size: 40px; 
                margin: 20px 0 0 0;
            }
            /* Animation of the icon */
            @keyframes float 
            {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
            }

            /* Wrapper Container */
            .wrapper 
            {
                width: 100%;
                display: block;    
                padding: 60px 15px;  
                margin: 0px;
                border-radius: 20px;
                flex-grow: 1; 
                box-sizing: border-box;
                overflow: hidden; 
                position: relative;
            }

            /* Device Frame */
            .demo-iframe {
                width: 100%;
                height: 820px; 
                padding: 30px 0px;
                border: none;
                border-radius: 20px;
                display: block;
            }
                
            /* Button */
            .btn
            {
                display: inline-block;
                margin: 50px 0px;
                background-color: #666666;
                color: white;
                padding: 20px 45px;
                border-radius: 8px;
                font-weight: bold;
                font-size: 15px;
                text-decoration: none;
                transition: background 0.2s ease;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }                
            
            /* Hover animation of the download button */
            #btn-download:hover 
            {
                background-color: #3DDC84;
                color: #333;
            }
            
            /* --- IPHONE SPECIFIC FORCED ZOOM EXTENSION --- */
            @media screen and (max-width: 430px) 
            {
                .content-container {
                    max-width: 350px; 
                    height: 90vh; 
                    max-height: 760px;
                    padding: 12px;
                    border-width: 8px; 
                }

                .icon-div {
                    flex-shrink: 0; 
                }

                #title {
                    margin: 5px 0 0 0; 
                    font-size: 18px;
                }

                #icon {
                    height: 40px; 
                    width: 40px;
                }

                .wrapper {
                    padding: 0px; 
                    margin: 5px auto;
                    width: 100%;
                    height: 52vh; 
                    overflow: hidden !important;
                    position: relative;
                    background-color: #f7f7f7;
                }
                
                .demo-iframe 
                {
                    width: 130%;  
                    height: 130%; 
                    transform: scale(0.76); 
                    transform-origin: top left; 
                    
                    padding: 0px; 
                    border: none;
                    border-radius: 12px;
                    display: block;
                    position: absolute;
                    top: 0;
                    left: 0;
                }

                .btn {
                    margin: 5px 0px; 
                    padding: 10px 20px;
                    font-size: 13px;
                }

                a {
                    flex-shrink: 0; 
                    width: 100%;
                }
            }
        </style>
    </head>
    <body>
        <div class="content-container">
            <div class="icon-div">
                <img id="icon" src="./src/assets/icon/favicon.png"/>
                <p id="title">Word Game</p>
            </div>
            
            <div class="wrapper">
                <iframe class="demo-iframe" src="./www/demo.html" title="Word Game Demo"></iframe>
            </div>
            
            <a href="./WordGame.apk" download style="text-decoration: none;">
                <div class="btn" id="btn-download">
                    Download Android APP
                </div>
            </a>
        </div>
    </body>
</html>
