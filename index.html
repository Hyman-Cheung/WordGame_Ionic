<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Word Game</title>
        <style>
            /* Background */
            body 
            {
                font-family: Arial, sans-serif;
                text-align: center;
                background-image: url(./src/assets/gameBackground4.jpg);
                padding: 40px 20px;
                margin: 0;
            }
            
            /* Content Container */
            .content-container 
            {
                max-width: 600px;
                margin: 0 auto;
                background: white;
                padding: 30px;
                border: 13px solid #333333;
                border-radius: 30px;
                box-shadow: 0px 100px 300px rgba(0,0,0,0.3);
            }
            
			/* Icon */
			.icon-div 
			{
				animation: float 3s ease-in-out infinite;
				font-weight: bold;
				font-size: 24px;
			}

			#icon
			{
				margin-bottom: -20px;
				height:80px;
				width:80px; 
			}

			/* Animation of the icon */
			@keyframes float 
			{
				0% { transform: translateY(0px); }
				50% { transform: translateY(-10px); }
				100% { transform: translateY(0px); }
			}

			/* Animation of the icon */
			@keyframes float 
			{
				0% { transform: translateY(0px); }
				50% { transform: translateY(-10px); }
				100% { transform: translateY(0px); }
			}

            /* Wrapper Container */
            .wrapper 
            {
                display: block;
                margin: 30px auto 10px auto;
                padding: 20px;
                border: 2px dashed #333333;
                border-radius: 24px;
                background-color: #eeeeee;
                max-width: 420px; /* Slightly wider to easily fit the phone layout */
            }

            
            /* Device Frame */
            .demo-iframe {
                width: 100%;
                height: 810px; 
                border: none;
                border-radius: 20px;
                display: block;
            }
                
            /* Button */
            .btn
            {
                display: inline-block;
                margin-top: 20px;
                background-color: #666666;
                color: white;
                padding: 12px 30px;
                border-radius: 8px;
                font-weight: bold;
                font-size: 15px;
                text-decoration: none;
                transition: background 0.2s ease;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }               
            
            /* Hover animation of the download button */
            #btn-download:hover 
            {
                background-color: #ffc505;
                color: #333;
            }
            
        </style>
    </head>
    <body>
        <div class="content-container">
			<!-- Icon -->
			<div class="icon-div">
				<img id= "icon" src="./src/assets/icon/favicon.png"/>
				<p id="title">Word Game</p>
			</div>
			
			<!-- Device Frame -->
            <div class="wrapper">
                <iframe class="demo-iframe" src="./www/demo.html" title="Word Game Demo"></iframe>
            </div>
            
            <a href="./WordGame.apk" download style="text-decoration: none;">
                <div class="btn" id="btn-download">
                    Download Android APP
                </div>
            </a>
        </div>
    </body>
</html>
