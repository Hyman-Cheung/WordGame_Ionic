<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Word Game</title>
        <style>
            /***** Background & Reset *****/
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body 
            {
                background-image: url(./src/assets/gameBackground2.jpg);  
                background-position: center;
                text-align: center; 
                display: flex;
                align-items: center;
                min-height: 100vh;
                padding: 20px;
                font-family: sans-serif;
            }
            
            /***** Content Container *****/
            .content-container 
            {
                background-color: #FFFFFF;
                width: 100%;
                max-width: 600px; /* Limits width on big screens */
                margin: 0 auto;
                padding: 30px 20px;
                border-radius: 30px;
                border: 13px solid #333333;
                display: flex;
                flex-direction: column;
                align-items: center;
                overflow: hidden;
                box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            }
            
            /***** Icon *****/
            .icon-div 
            {
                margin-bottom: 25px;
                animation: float 3s ease-in-out infinite;
            }
            .icon
            {
                height: 120px; 
                width: 120px;
            }
            .title
            {
                margin: 10px 0 0 0;
                font-weight: bold;  
                font-size: 30px;
            } 
			
            /***** Animation of the icon *****/
            @keyframes float 
            {
                0% { transform: translateY(0px); }
                50% { transform: translateY(-10px); }
                100% { transform: translateY(0px); }
            }

        /***** The Phone Chassis (Responsive Layout) *****/
        .phone-frame 
		{
            position: relative;
            width: 100%;
            max-width: 360px;    /* Looks like a realistic phone on PC */
            height: 640px;       /* Good aspect ratio */
            background: #1a1a1a; /* Sleek black phone bezel */
            border-radius: 40px;
            padding: 12px;       /* Bezel thickness */
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.4);
        }

        /***** Camera Lens cut-out at the top *****/
        .phone-camera 
		{
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);
            width: 50px;
            height: 12px;
            background: #000;
            border-radius: 10px;
            z-index: 10;
        }

        /***** The screen displaying your compiled Ionic web code *****/
        .phone-screen 
		{
            width: 100%;
            height: 100%;
            background: #fff;
            border: none;
            border-radius: 28px;
            overflow: hidden;
        }
			
            /***** Button *****/
            .btn
            {
                display: inline-block;
                background-color: #666666;
                color: white;
                margin-top: 25px;
                padding: 15px 35px;
                border-radius: 30px;
                font-weight: bold;
                font-size: 20px;
                text-decoration: none;
                transition: background 0.2s ease;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            }                
            /***** Hover animation of the download button *****/
            #btn-download:hover 
            {
                background-color: #3DDC84;
                color: #333;
            }
			
			/***** Mobile Styles *****/
			@media screen and (max-width: 420px)
			{
                body {
                    padding: 10px;
                }
                .content-container 
                {
                    border: 6px solid #333333; /* Thinner border so it doesn't crowd the screen */
                    padding: 15px 10px;
                    border-radius: 20px;
                }
                .phone-frame 
				{
                    height: 480px; /* Scales down the height so everything fits on a small mobile screen */
                    border-radius: 30px;
                }
                .phone-screen 
				{
                    border-radius: 18px;
                }
				.icon-div 
				{
					margin-bottom: 10px;
				}
                .icon 
				{
                    height: 60px;
                    width: 60px;
                }
                .title 
				{
                    font-size: 20px;
                }
                .btn 
				{
                    font-size: 18px;
                    padding: 12px 25px;
                    margin-top: 15px;
                }
			}
        </style>
    </head>
    <body>
		<div class="content-container">
			<div class="icon-div">
                <img class="icon" src="./src/assets/icon/favicon.png"/>
                <p class="title">Word Game</p>
            </div>
            
			<div class="phone-frame">
				<div class="phone-camera"></div>
				<iframe class="phone-screen" src="./www/index.html"></iframe>
			</div>
            
			<a href="./WordGame.apk" download style="text-decoration: none;">
                <div class="btn" id="btn-download">
                    Download Android APP
                </div>
            </a>
        </div>
    </body>
</html>
